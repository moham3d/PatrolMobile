name: AI Sequential Checklist Automation

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  next-checklist-task:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Find next unchecked checklist item
      id: next_item
      run: |
        CHECKLIST_FILE=".github/mobile-development-instructions.md"
        NEXT_ITEM_LINE=$(grep -n '^\[ \]' $CHECKLIST_FILE | head -n 1 | cut -d: -f1)
        if [ -z "$NEXT_ITEM_LINE" ]; then
          echo "No more unchecked items. Workflow complete."
          echo "has_next_item=false" >> $GITHUB_OUTPUT
        else
          ITEM_TEXT=$(sed -n "${NEXT_ITEM_LINE}p" $CHECKLIST_FILE | sed 's/^\[ \] //')
          echo "item_text=$ITEM_TEXT" >> $GITHUB_OUTPUT
          echo "item_line=$NEXT_ITEM_LINE" >> $GITHUB_OUTPUT
          echo "has_next_item=true" >> $GITHUB_OUTPUT
        fi

    - name: Open issue for next checklist task
      if: steps.next_item.outputs.has_next_item == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const itemText = process.env['item_text'];
          github.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `AI Agent: Next Task - ${itemText}`,
            body: `Proceed to the next checklist item:\n\n${itemText}\n\nRefer to .github/mobile-development-instructions.md and AI-AGENT-INIT-PROMPT.md for all instructions.`
          });

    - name: All tasks complete
      if: steps.next_item.outputs.has_next_item == 'false'
      run: echo "🎉 All checklist tasks are complete!"
