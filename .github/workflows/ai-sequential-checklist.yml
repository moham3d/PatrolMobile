name: AI Sequential Checklist Automation

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  next-checklist-task:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Find next unchecked checklist item
      id: next_item
      run: |
        CHECKLIST_FILE=".github/mobile-development-instructions.md"
        NEXT_ITEM=$(grep -n '^\[ \]' $CHECKLIST_FILE | head -n 1 | cut -d: -f1)
        if [ -z "$NEXT_ITEM" ]; then
          echo "No more unchecked items. Workflow complete."
          echo "has_next_item=false" >> $GITHUB_OUTPUT
        else
          echo "Next checklist item is at line $NEXT_ITEM"
          # Optionally extract the actual checklist text:
          ITEM_TEXT=$(sed -n "${NEXT_ITEM}p" $CHECKLIST_FILE)
          echo "item_text=$ITEM_TEXT" >> $GITHUB_OUTPUT
          echo "item_line=$NEXT_ITEM" >> $GITHUB_OUTPUT
          echo "has_next_item=true" >> $GITHUB_OUTPUT
        fi

    - name: Trigger Copilot/AI Agent for Next Task
      if: steps.next_item.outputs.has_next_item == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          // Replace this with your integration: open an issue, PR, or trigger your AI agent,
          // passing the next checklist item to the agent.
          const itemText = process.env['item_text'];
          const itemLine = process.env['item_line'];
          // Example: Create an issue to prompt the AI agent (pseudo-code)
          github.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `AI Agent: Next Task - ${itemText}`,
            body: `Proceed to checklist item at line ${itemLine}:\n\n${itemText}\n\nFollow all instructions in AI-AGENT-INIT-PROMPT.md.`
          });

    - name: All tasks complete
      if: steps.next_item.outputs.has_next_item == 'false'
      run: echo "🎉 All checklist tasks are complete!"
