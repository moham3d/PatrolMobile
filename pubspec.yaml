name: patrol_shield_mobile
description: PatrolShield Security Management Mobile App for Guards, Supervisors, and Site Managers
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API Communication
  dio: ^5.3.2
  
  # State Management & Navigation  
  flutter_riverpod: ^2.4.6
  go_router: ^12.1.1
  
  # Security & Storage
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.6
  crypto: ^3.0.3
  
  # Location & GPS
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  
  # Emergency & Communication
  web_socket_channel: ^2.4.0
  flutter_local_notifications: ^16.1.0
  
  # Scanning & NFC
  qr_code_scanner: ^1.0.1
  nfc_manager: ^3.3.0
  
  # Media & Camera
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  
  # Offline Storage & Sync
  sqflite: ^2.3.0
  hive: ^2.2.3
  connectivity_plus: ^5.0.1
  
  # UI & UX
  flutter_map: ^6.1.0
  cached_network_image: ^3.3.0
  lottie: ^2.7.0

  # Utilities
  uuid: ^4.1.0
  intl: ^0.18.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700